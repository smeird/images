[images]
user = images
group = images
listen = /run/php/php8.5-fpm-images.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
php_admin_value[open_basedir] = /var/www/images:/tmp:/usr/share/fonts
php_admin_value[upload_max_filesize] = 150M
php_admin_value[post_max_size] = 160M
php_admin_value[upload_tmp_dir] = /var/www/images/storage/uploads/tmp
php_admin_value[session.save_path] = /var/www/images/storage/sessions
php_admin_value[error_log] = /var/log/php8.5-fpm-images.log
php_admin_flag[log_errors] = on
